<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>在线仪表：工业过程控制的眼睛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.3);
            max-width: 1200px;
            width: 100%;
            padding: 60px;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .title {
            font-size: 42px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .subtitle {
            font-size: 28px;
            color: #2c3e50;
            font-weight: 300;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 50px;
        }

        .column {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .column:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .column-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            padding-bottom: 15px;
        }

        .column-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 4px;
            border-radius: 2px;
        }

        .left-column .column-title {
            color: #2ecc71;
        }

        .left-column .column-title::after {
            background: linear-gradient(90deg, #2ecc71, #27ae60);
        }

        .right-column {
            background: linear-gradient(135deg, #ffeaa7 0%, #fd79a8 100%);
        }

        .right-column .column-title {
            color: #e74c3c;
        }

        .right-column .column-title::after {
            background: linear-gradient(90deg, #e74c3c, #c0392b);
        }

        .item {
            font-size: 24px;
            padding: 18px 25px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 12px;
            border-left: 5px solid;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .left-column .item {
            border-left-color: #2ecc71;
        }

        .right-column .item {
            border-left-color: #e74c3c;
        }

        .item:hover {
            transform: translateX(10px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .item::before {
            content: '';
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .left-column .item::before {
            background: #2ecc71;
            box-shadow: 0 0 10px #2ecc71;
        }

        .right-column .item::before {
            background: #e74c3c;
            box-shadow: 0 0 10px #e74c3c;
        }

        .footer {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            text-align: center;
            padding: 30px;
            border-radius: 20px;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .footer::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% {
                transform: rotate(0deg) translate(-50%, -50%);
            }
            100% {
                transform: rotate(360deg) translate(-50%, -50%);
            }
        }

        .footer-text {
            position: relative;
            z-index: 1;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px;
            }

            .title {
                font-size: 28px;
            }

            .subtitle {
                font-size: 20px;
            }

            .content {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .column-title {
                font-size: 24px;
            }

            .item {
                font-size: 18px;
            }

            .footer {
                font-size: 20px;
            }
        }

        /* 装饰性元素 */
        .decoration {
            position: fixed;
            border-radius: 50%;
            opacity: 0.1;
            z-index: 0;
        }

        .decoration-1 {
            width: 300px;
            height: 300px;
            background: #2ecc71;
            top: -150px;
            left: -150px;
        }

        .decoration-2 {
            width: 400px;
            height: 400px;
            background: #e74c3c;
            bottom: -200px;
            right: -200px;
        }

        .decoration-3 {
            width: 250px;
            height: 250px;
            background: #3498db;
            top: 50%;
            right: -125px;
        }
    </style>
</head>
<body>
    <div class="decoration decoration-1"></div>
    <div class="decoration decoration-2"></div>
    <div class="decoration decoration-3"></div>

    <div class="container">
        <div class="header">
            <div class="title">在线仪表：工业过程控制过程的眼睛</div>
        </div>

        <div class="content">
            <div class="column left-column">
                <div class="column-title">✓ 作用</div>
                <div class="item">生产安全监控</div>
                <div class="item">工艺优化控制</div>
                <div class="item">产品质量保障</div>
            </div>

            <div class="column right-column">
                <div class="column-title">✗ 故障后果</div>
                <div class="item">非计划停机</div>
                <div class="item">能源浪费</div>
                <div class="item">经济损失</div>
            </div>
        </div>

        <div class="footer">
            <div class="footer-text">在线仪表的运行维护至关重要</div>
        </div>
    </div>
</body>
</html>
